  <script>
    const contenedorSlider = document.getElementById('sliderArcos');
    const tarjetas = Array.from(contenedorSlider.querySelectorAll('.imagen-arco'));
    
    let indiceActual = 0;
    let estaArrastrando = false;
    let inicioX = 0;
    let desplazamientoX = 0;
    let enTransicion = false;

    // Función que actualiza los estados CSS de cada tarjeta según el índice activo
    function actualizarPosiciones() {
      const total = tarjetas.length;
      const indiceSiguiente = (indiceActual + 1) % total;

      tarjetas.forEach((tarjeta, index) => {
        tarjeta.classList.remove('arrastrando');
        tarjeta.style.transform = '';

        // Si solo tienes 2 tarjetas en tu HTML, se intercambian directamente frente y fondo
        if (total === 2) {
          if (index === indiceActual) {
            tarjeta.className = 'imagen-arco estado-frente';
          } else {
            tarjeta.className = 'imagen-arco estado-fondo';
          }
          return;
        }

        // Si tienes 3 o más tarjetas, hace el ciclo completo con salida hacia la izquierda
        const indiceAnterior = (indiceActual - 1 + total) % total;

        if (index === indiceActual) {
          tarjeta.className = 'imagen-arco estado-frente';
        } else if (index === indiceSiguiente) {
          tarjeta.className = 'imagen-arco estado-fondo';
        } else if (index === indiceAnterior) {
          tarjeta.className = 'imagen-arco estado-saliendo';
        } else {
          tarjeta.className = 'imagen-arco estado-oculto';
        }
      });
    }

    // Avanza a la siguiente imagen cuando se completa el arrastre a la izquierda
    function cambiarSiguienteImagen() {
      if (enTransicion) return;
      enTransicion = true;

      indiceActual = (indiceActual + 1) % tarjetas.length;
      actualizarPosiciones();

      setTimeout(() => {
        enTransicion = false;
      }, 650); // Tiempo sincronizado con los 0.65s del CSS
    }

    // --- EVENTOS DE MOUSE Y PANTALLA TÁCTIL ---
    function iniciarArrastre(clientX) {
      if (enTransicion) return;
      estaArrastrando = true;
      inicioX = clientX;
      desplazamientoX = 0;
      tarjetas[indiceActual].classList.add('arrastrando');
    }

    function moverArrastre(clientX) {
      if (!estaArrastrando) return;
      desplazamientoX = clientX - inicioX;

      // Solo aplicamos seguimiento visual si arrastra hacia la izquierda (valores negativos)
      if (desplazamientoX < 0) {
        const rotacion = Math.max(desplazamientoX * 0.05, -12);
        tarjetas[indiceActual].style.transform = `translateX(${desplazamientoX * 0.6}px) rotate(${rotacion}deg)`;
      }
    }

    function finalizarArrastre() {
      if (!estaArrastrando) return;
      estaArrastrando = false;

      const tarjetaActiva = tarjetas[indiceActual];
      tarjetaActiva.classList.remove('arrastrando');
      tarjetaActiva.style.transform = '';

      // Si el usuario arrastró más de 50px hacia la izquierda, dispara el cambio de imagen
      if (desplazamientoX < -50) {
        cambiarSiguienteImagen();
      }
      desplazamientoX = 0;
    }

    // Eventos de Mouse
    contenedorSlider.addEventListener('mousedown', (e) => iniciarArrastre(e.clientX));
    window.addEventListener('mousemove', (e) => moverArrastre(e.clientX));
    window.addEventListener('mouseup', finalizarArrastre);

    // Eventos Táctiles (por si se prueba en móvil)
    contenedorSlider.addEventListener('touchstart', (e) => iniciarArrastre(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => moverArrastre(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', finalizarArrastre);
  </script>
